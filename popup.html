<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>crossDSA</title>
    <style>
      body {
        width: 330px;
        padding: 12px;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        background: linear-gradient(160deg, #131313 0%, #0a0a0a 100%);
        color: #ffffff;
        margin: 0;
        animation: fadeIn 0.3s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        margin-bottom: 12px;
      }

      .github-btn {
        position: absolute;
        left: 0;
        background: rgba(255, 255, 255, 0.06);
        color: #2dd4bf;
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 5px 9px;
        border-radius: 9px;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.15s ease;
      }

      .github-btn:hover {
        background: rgba(45, 212, 191, 0.14);
      }

      .header h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.4px;
        color: #ffffff;
      }

      .header-controls {
        position: absolute;
        right: 0;
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .toggle-btn {
        background: rgba(255, 255, 255, 0.06);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 4px 7px;
        border-radius: 9px;
        cursor: pointer;
        display: flex;
        align-items: center;
        transition: background 0.15s ease;
      }

      .toggle-btn:hover {
        background: rgba(255, 255, 255, 0.13);
      }

      .section {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 12px;
        padding: 11px 12px;
        margin-bottom: 10px;
        opacity: 0;
        animation: slideUp 0.25s ease-out forwards;
      }

      .section:nth-child(3) { animation-delay: 0.03s; }
      .section:nth-child(4) { animation-delay: 0.06s; }

      .section-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1.1px;
        color: #2dd4bf;
        margin-bottom: 10px;
      }

      .section-title::after {
        content: '';
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, rgba(45, 212, 191, 0.4), transparent);
      }

      .setting-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        margin-bottom: 8px;
        font-weight: 600;
      }

      .similarity-value {
        background: linear-gradient(135deg, #14b8a6, #2dd4bf);
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.25);
        min-width: 30px;
        text-align: center;
      }

      .slider {
        width: 100%;
        height: 5px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.12);
        outline: none;
        appearance: none;
        cursor: pointer;
      }

      .slider::-webkit-slider-thumb {
        appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: linear-gradient(135deg, #2dd4bf, #0f766e);
        cursor: pointer;
        box-shadow: 0 3px 7px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.45);
        border: 2px solid rgba(255, 255, 255, 0.35);
      }

      .preset-buttons {
        display: flex;
        gap: 5px;
        margin-top: 8px;
      }

      .preset-btn {
        flex: 1;
        background: rgba(255, 255, 255, 0.05);
        color: #d6d6d6;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 5px 8px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        transition: all 0.2s ease;
      }

      .preset-btn:hover {
        background: rgba(45, 212, 191, 0.14);
        border-color: rgba(45, 212, 191, 0.5);
      }

      .preset-btn.active {
        background: linear-gradient(135deg, #14b8a6, #0d9488);
        color: #ffffff;
        border-color: rgba(45, 212, 191, 0.8);
        font-weight: 700;
      }

      .platform-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .platform-chip {
        position: relative;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.09);
        cursor: pointer;
        transition: all 0.15s ease;
        user-select: none;
      }

      .platform-chip:hover {
        background: rgba(255, 255, 255, 0.09);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .platform-chip input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .chip-check {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1.5px solid rgba(255, 255, 255, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        color: transparent;
        transition: all 0.15s ease;
      }

      .chip-check svg {
        width: 10px;
        height: 10px;
      }

      .chip-name {
        font-size: 12px;
        font-weight: 700;
        color: #e2e2e2;
      }

      .chip-count {
        margin-left: auto;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.4);
        font-weight: 600;
      }

      .platform-chip.checked {
        background: rgba(20, 184, 166, 0.14);
        border-color: rgba(45, 212, 191, 0.55);
      }

      .platform-chip.checked .chip-check {
        background: linear-gradient(135deg, #2dd4bf, #0f766e);
        border-color: transparent;
        color: #ffffff;
      }

      .platform-chip.checked .chip-name {
        color: #ffffff;
      }

      .hint {
        font-size: 10px;
        color: rgba(255, 255, 255, 0.42);
        margin-top: 8px;
        line-height: 1.5;
        font-weight: 500;
      }

      .stats-section {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
      }

      .stat-label {
        color: rgba(255, 255, 255, 0.55);
        font-weight: 500;
      }

      .stat-value {
        color: #2dd4bf;
        font-weight: 800;
        font-size: 13px;
      }

      .footer-note {
        text-align: center;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.3);
        margin-top: 9px;
        opacity: 0;
        animation: fadeIn 0.4s ease-out 0.2s forwards;
      }

      .footer-note a {
        color: rgba(45, 212, 191, 0.8);
        text-decoration: none;
      }

      .footer-note a:hover {
        color: #2dd4bf;
        text-decoration: underline;
      }

      .status-blob {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .status-blob.active {
        background: #48bb78;
      }

      .status-blob.inactive {
        background: #f56565;
      }

      ::-webkit-scrollbar {
        width: 5px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 3px;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.35);
        border-radius: 3px;
      }

      /* Deliberately plain, utility-style settings UI. */
      body {
        width: 336px;
        padding: 0;
        color: #202124;
        background: #f7f8f9;
        animation: none;
      }

      .header {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 10px;
        justify-content: initial;
        padding: 14px 16px 12px;
        margin: 0;
        background: #ffffff;
        border-bottom: 1px solid #dfe1e5;
      }

      .header h1 {
        grid-column: 1;
        grid-row: 1;
        justify-self: start;
        font-size: 16px;
        font-weight: 650;
        letter-spacing: -0.2px;
        color: #202124;
      }

      .github-btn {
        position: static;
        color: #5f6368;
        background: transparent;
        border: 0;
        border-radius: 4px;
        padding: 5px 3px;
        font-size: 12px;
        font-weight: 500;
      }

      .github-btn:hover {
        color: #0f766e;
        background: transparent;
        text-decoration: underline;
      }

      .header-controls {
        position: static;
        grid-column: 3;
        gap: 6px;
      }

      .toggle-btn {
        width: 30px;
        height: 28px;
        justify-content: center;
        padding: 0;
        color: #3c4043;
        background: #ffffff;
        border: 1px solid #dadce0;
        border-radius: 6px;
      }

      .toggle-btn:hover {
        background: #f1f3f4;
        border-color: #bdc1c6;
      }

      .toggle-btn:focus-visible,
      .preset-btn:focus-visible,
      .platform-chip:focus-within {
        outline: 2px solid #0d9488;
        outline-offset: 2px;
      }

      .section {
        margin: 12px 12px 0;
        padding: 13px 14px;
        background: #ffffff;
        border: 1px solid #dfe1e5;
        border-radius: 8px;
        box-shadow: none;
        opacity: 1;
        animation: none;
      }

      .section-title {
        gap: 0;
        margin-bottom: 12px;
        color: #202124;
        font-size: 13px;
        font-weight: 650;
        text-transform: none;
        letter-spacing: 0;
      }

      .section-title::after {
        display: none;
      }

      .setting-label {
        margin-bottom: 12px;
        color: #5f6368;
        font-size: 12px;
        font-weight: 400;
      }

      .similarity-value {
        min-width: 24px;
        padding: 2px 6px;
        color: #3c4043;
        background: #f1f3f4;
        border: 1px solid #dadce0;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
      }

      .slider {
        height: 4px;
        border-radius: 2px;
        background: #dfe1e5;
      }

      .slider::-webkit-slider-thumb {
        width: 15px;
        height: 15px;
        background: #0d9488;
        border: 2px solid #ffffff;
        box-shadow: 0 0 0 1px #0d9488;
      }

      .preset-buttons {
        gap: 6px;
        margin-top: 12px;
      }

      .preset-btn {
        padding: 6px 8px;
        color: #5f6368;
        background: #ffffff;
        border: 1px solid #dadce0;
        border-radius: 5px;
        font-size: 11px;
        font-weight: 500;
        transition: background 0.12s ease, border-color 0.12s ease;
      }

      .preset-btn:hover {
        color: #202124;
        background: #f8f9fa;
        border-color: #bdc1c6;
      }

      .preset-btn.active {
        color: #115e59;
        background: #ccfbf1;
        border-color: #5eead4;
        font-weight: 600;
      }

      .platform-grid {
        gap: 7px;
      }

      .platform-chip {
        gap: 8px;
        padding: 9px 10px;
        background: #ffffff;
        border: 1px solid #dadce0;
        border-radius: 6px;
        transition: background 0.12s ease, border-color 0.12s ease;
      }

      .platform-chip:hover {
        background: #f8f9fa;
        border-color: #bdc1c6;
      }

      .chip-check {
        width: 15px;
        height: 15px;
        border: 1px solid #9aa0a6;
        border-radius: 3px;
      }

      .chip-check svg {
        width: 9px;
        height: 9px;
      }

      .chip-name {
        color: #3c4043;
        font-size: 12px;
        font-weight: 500;
      }

      .chip-count {
        color: #80868b;
        font-size: 10px;
        font-weight: 400;
      }

      .platform-chip.checked {
        background: #f0fdfa;
        border-color: #5eead4;
      }

      .platform-chip.checked .chip-check {
        color: #ffffff;
        background: #0d9488;
        border-color: #0d9488;
      }

      .platform-chip.checked .chip-name {
        color: #202124;
      }

      .hint {
        margin-top: 10px;
        color: #80868b;
        font-size: 10px;
        font-weight: 400;
        line-height: 1.4;
      }

      .stats-section {
        gap: 9px;
      }

      .stat-row {
        font-size: 12px;
      }

      .stat-label {
        color: #5f6368;
        font-weight: 400;
      }

      .stat-value {
        color: #202124;
        font-size: 12px;
        font-weight: 600;
      }

      .footer-note {
        margin: 0;
        padding: 12px 16px 14px;
        color: #80868b;
        font-size: 10px;
        opacity: 1;
        animation: none;
      }

      .footer-note a,
      .footer-note a:hover {
        color: #0f766e;
      }

      .status-blob {
        width: 7px;
        height: 7px;
      }

      .status-blob.active { background: #188038; }
      .status-blob.inactive { background: #d93025; }

      ::-webkit-scrollbar-track { background: #f1f3f4; }
      ::-webkit-scrollbar-thumb { background: #bdc1c6; }

      @media (prefers-color-scheme: dark) {
        body {
          color: #e5e7eb;
          background: #111315;
        }

        .header {
          background: #191c1f;
          border-bottom-color: #303438;
        }

        .header h1,
        .section-title,
        .stat-value,
        .platform-chip.checked .chip-name {
          color: #f3f4f6;
        }

        .github-btn,
        .setting-label,
        .stat-label {
          color: #a7adb4;
        }

        .github-btn:hover,
        .footer-note a,
        .footer-note a:hover {
          color: #5eead4;
        }

        .toggle-btn {
          color: #d1d5db;
          background: #22262a;
          border-color: #3b4045;
        }

        .toggle-btn:hover {
          background: #2b3035;
          border-color: #555b61;
        }

        .section {
          background: #191c1f;
          border-color: #303438;
        }

        .similarity-value {
          color: #d1d5db;
          background: #25292d;
          border-color: #3b4045;
        }

        .slider {
          background: #3b4045;
        }

        .slider::-webkit-slider-thumb {
          background: #2dd4bf;
          border-color: #191c1f;
          box-shadow: 0 0 0 1px #2dd4bf;
        }

        .preset-btn {
          color: #b7bdc3;
          background: #191c1f;
          border-color: #3b4045;
        }

        .preset-btn:hover {
          color: #f3f4f6;
          background: #25292d;
          border-color: #555b61;
        }

        .preset-btn.active {
          color: #99f6e4;
          background: #123c38;
          border-color: #277c72;
        }

        .platform-chip {
          background: #191c1f;
          border-color: #3b4045;
        }

        .platform-chip:hover {
          background: #22262a;
          border-color: #555b61;
        }

        .platform-chip.checked {
          background: #162e2b;
          border-color: #277c72;
        }

        .platform-chip.checked .chip-check {
          color: #09201d;
          background: #2dd4bf;
          border-color: #2dd4bf;
        }

        .chip-check {
          border-color: #6b737a;
        }

        .chip-name {
          color: #d1d5db;
        }

        .chip-count,
        .hint,
        .footer-note {
          color: #8c949c;
        }

        .status-blob.active { background: #34d399; }
        .status-blob.inactive { background: #f87171; }

        ::-webkit-scrollbar-track { background: #191c1f; }
        ::-webkit-scrollbar-thumb { background: #555b61; }
      }

      .header {
        grid-template-columns: 1fr auto;
      }

      .github-btn {
        grid-column: 2;
      }

      .visibility-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 12px 12px 0;
        padding: 11px 14px;
        background: #ffffff;
        border: 1px solid #dfe1e5;
        border-radius: 8px;
      }

      .visibility-title,
      .setting-heading {
        color: #202124;
        font-size: 13px;
        font-weight: 650;
      }

      .setting-heading {
        margin-bottom: 12px;
      }

      .toggle-btn {
        width: auto;
        height: auto;
        gap: 8px;
        padding: 0;
        color: #5f6368;
        background: transparent;
        border: 0;
        border-radius: 0;
        font: inherit;
      }

      .toggle-btn:hover {
        color: #202124;
        background: transparent;
        border-color: transparent;
      }

      .toggle-state {
        min-width: 18px;
        font-size: 11px;
        font-weight: 500;
        text-align: right;
      }

      .toggle-track {
        position: relative;
        width: 30px;
        height: 18px;
        flex: 0 0 auto;
        background: #bdc1c6;
        border-radius: 999px;
        transition: background 0.15s ease;
      }

      .toggle-thumb {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 12px;
        height: 12px;
        background: #ffffff;
        border-radius: 50%;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        transition: transform 0.15s ease;
      }

      .toggle-btn.enabled {
        color: #0f766e;
      }

      .toggle-btn.enabled .toggle-track {
        background: #0d9488;
      }

      .toggle-btn.enabled .toggle-thumb {
        transform: translateX(12px);
      }

      .footer-note {
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-align: left;
      }

      .footer-note strong {
        color: #5f6368;
        font-weight: 600;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (prefers-color-scheme: dark) {
        .visibility-row {
          background: #191c1f;
          border-color: #303438;
        }

        .visibility-title,
        .setting-heading {
          color: #f3f4f6;
        }

        .toggle-btn,
        .toggle-btn:hover {
          color: #a7adb4;
          background: transparent;
        }

        .toggle-btn.enabled {
          color: #5eead4;
        }

        .toggle-btn.enabled .toggle-track {
          background: #2dd4bf;
        }

        .toggle-btn.enabled .toggle-thumb {
          background: #09201d;
        }

        .toggle-track {
          background: #555b61;
        }

        .footer-note strong {
          color: #b7bdc3;
        }
      }

      /* Compact popup layout. */
      .section,
      .visibility-row {
        margin-top: 8px;
        padding: 10px 12px;
      }

      .search-control-row {
        gap: 10px;
      }

      .setting-heading {
        margin-bottom: 9px;
      }

      .slider-endpoints {
        display: flex;
        justify-content: space-between;
        margin-top: 7px;
        color: #80868b;
        font-size: 9px;
      }

      .platform-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 5px;
      }

      .platform-chip {
        justify-content: center;
        gap: 5px;
        min-width: 0;
        padding: 6px 7px;
      }

      .chip-check {
        width: 13px;
        height: 13px;
      }

      .chip-check svg {
        width: 8px;
        height: 8px;
      }

      .chip-name {
        font-size: 10px;
      }

      .random-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .random-heading .section-title {
        margin: 0;
      }

      .random-pick-btn {
        padding: 5px 8px;
        color: #0f766e;
        background: #ffffff;
        border: 1px solid #99dacf;
        border-radius: 5px;
        cursor: pointer;
        font: inherit;
        font-size: 10px;
        font-weight: 600;
      }

      .random-pick-btn:hover:not(:disabled) {
        background: #f0fdfa;
        border-color: #5eead4;
      }

      .random-pick-btn:disabled {
        cursor: default;
        opacity: 0.5;
      }

      .random-result {
        width: 100%;
        margin-top: 9px;
        padding: 9px 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #202124;
        background: #f7f8f9;
        border: 1px solid #dfe1e5;
        border-radius: 6px;
        cursor: pointer;
        text-align: left;
      }

      .random-result[hidden] {
        display: none;
      }

      .random-result:hover {
        background: #f0fdfa;
        border-color: #99dacf;
      }

      .random-copy {
        min-width: 0;
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 4px;
      }

      .random-title {
        overflow: hidden;
        color: #202124;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.25;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .random-meta {
        color: #80868b;
        font-size: 10px;
      }

      .random-arrow {
        color: #0f766e;
        font-size: 14px;
      }

      .footer-note {
        padding-top: 9px;
        padding-bottom: 11px;
      }

      @media (prefers-color-scheme: dark) {
        .slider-endpoints { color: #8c949c; }

        .random-pick-btn {
          color: #5eead4;

  <style>
    #platformGrid { display: grid; gap: 6px; }
    .platform-row { display: flex; align-items: center; gap: 7px; padding: 9px 8px; border: 1px solid #dadce0; border-radius: 6px; font-size: 12px; background: #fff; }
    .platform-row.checked { background: #f0fdfa; border-color: #5eead4; }
    .platform-identity { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
    .platform-link { color: inherit; text-decoration: none; }
    .platform-link:hover { text-decoration: underline; }
    .platform-link:focus-visible { outline: 2px solid #0d9488; outline-offset: 2px; }
    .platform-row input { margin: 0; accent-color: #0d9488; width: 14px; height: 14px; }
    .platform-row .platform-total { margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 600; }
    .platform-row .daily-button { padding: 2px 4px; border: 0; border-radius: 3px; background: transparent; color: #0f766e; font: inherit; font-size: 10px; cursor: pointer; white-space: nowrap; }
    .platform-row .daily-button:hover { background: #ccfbf1; }
    .platform-row .daily-button:focus-visible,.platform-row input:focus-visible { outline: 2px solid #0d9488; outline-offset: 2px; }
    .platform-row .daily-button:disabled { opacity: .5; cursor: wait; }
    .platform-row .daily-button.is-done { color: #16804a; font-weight: 600; }
    .daily-completion { display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; padding: 0; border: 1px solid #dadce0; border-radius: 50%; background: transparent; color: #80868b; font: inherit; font-size: 10px; cursor: pointer; }
    .daily-completion[hidden] { display: none; }
    .daily-completion:hover { border-color: #16804a; color: #16804a; }
    .daily-completion[aria-pressed="true"] { border-color: #16804a; background: #16804a; color: #fff; }
    .daily-completion:focus-visible { outline: 2px solid #0d9488; outline-offset: 2px; }
    .connect-platforms { font-size: 12px; color: #0f766e; text-decoration: none; }
    .connect-platforms:hover { text-decoration: underline; }
    #dailyStatus:empty { display: none; }
    @media (prefers-color-scheme: dark) {
      .platform-row { background: #191c1f; border-color: #3b4045; }
      .platform-row.checked { background: #162e2b; border-color: #277c72; }
      .platform-row .daily-button,.connect-platforms { color: #5eead4; }
      .platform-row .daily-button:hover { background: #123c38; }
      .platform-row .daily-button.is-done { color: #70cf9b; }
      .daily-completion { color: #8c949c; border-color: #3b4045; }
      .daily-completion:hover { color: #70cf9b; border-color: #70cf9b; }
    }
    #overviewTotal { display: block; }
    #overviewStatus { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
